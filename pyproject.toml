[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securechannel"
version = "0.1.0"
description = "Secure client-server channel with offensive validation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
  "pqcrypto==1.0.0",
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "httpx==0.27.2",
]

[tool.setuptools]
packages = ["secure_core", "insecure_variant", "attack_suite", "gui"]

[tool.setuptools.package-data]
gui = ["static/*"]

[project.scripts]
securechannel-gui = "gui.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
