<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureChannel Live GUI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>SecureChannel Live Visualization</h1>
      <p id="ws-status" class="status disconnected">Disconnected</p>
    </header>
    <main class="grid">
      <section class="card">
        <h2>Sequence Diagram</h2>
        <svg id="sequence" viewBox="0 0 900 360" aria-label="Handshake sequence diagram"></svg>
      </section>

      <section class="card">
        <h2>Attack Controls</h2>
        <div class="controls">
          <label for="variant">Target Variant</label>
          <select id="variant">
            <option value="secure_core">secure_core</option>
            <option value="insecure_variant">insecure_variant</option>
          </select>
          <button id="run-demo">Run full demo</button>
          <div class="attack-buttons">
            <button data-attack="mitm">Run MITM</button>
            <button data-attack="replay">Run Replay</button>
            <button data-attack="downgrade">Run Downgrade</button>
            <button data-attack="cert_spoof">Run Cert Spoof</button>
            <button data-attack="dos">Run DoS</button>
          </div>
        </div>
        <table id="attack-results">
          <thead>
            <tr><th>Attack</th><th>Target</th><th>Outcome</th><th>Detail</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Key Derivation (Fingerprints)</h2>
        <table id="key-panel">
          <thead>
            <tr><th>Connection</th><th>Variant</th><th>Cipher</th><th>C2S</th><th>S2C</th><th>Transcript</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Report Panel</h2>
        <table id="report-table">
          <thead>
            <tr><th>Variant</th><th>Attack</th><th>Outcome</th><th>Details</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card full-width">
        <h2>Live Event Log</h2>
        <div id="event-log" class="event-log" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
